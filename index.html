<meta name="theme-color" content="#1b2024">
<style>
  :root{
    --bg:#e4e7e9;
    --panel:#f6f7f7;
    --ink:#1b2024;
    --muted:#5c6770;
    --border:#c4cbd0;
    --ready:#1f6f52;
    --build:#b1720f;
    --alert:#a83b2a;
    --accent:#2b4a5e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{ max-width:860px; margin:0 auto; padding:20px 16px 80px; }

  header.top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    padding-bottom:16px;
    border-bottom:3px solid var(--ink);
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .brand h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:28px;
    text-transform:uppercase;
    letter-spacing:0.01em;
    margin:0;
    line-height:1.05;
  }
  .brand .sub{ font-family:'IBM Plex Sans', sans-serif; font-size:12px; color:var(--muted); margin-top:2px; }
  .top-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .whoami{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--muted); }
  .add-btn{
    font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:14px;
    background:var(--ink); color:#fff; border:none; padding:11px 18px; cursor:pointer; white-space:nowrap;
  }
  .add-btn:active{ transform:translateY(1px); }
  .linkbtn{ background:none; border:none; color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; padding:4px 2px; }

  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border:1px solid var(--border); margin-bottom:18px; }
  .stat{ background:var(--panel); padding:12px 14px; }
  .stat .num{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:22px; }
  .stat .lbl{ font-size:12px; color:var(--muted); margin-top:2px; }
  .stat.alertstat .num{ color:var(--alert); }

  .searchrow{ display:flex; gap:8px; margin-bottom:6px; }
  .searchbox{position:relative;flex:1;display:flex;align-items:center;}
  .searchbox svg{position:absolute;left:14px;width:19px;height:19px;color:#7d8796;pointer-events:none;z-index:2;}
  .searchbox input{padding-left:43px!important;width:100%;box-sizing:border-box;}
  .search-hint{ font-size:11px; color:var(--muted); margin-bottom:18px; }
  .searchrow input{
    flex:1; font-family:'IBM Plex Sans', sans-serif; font-size:14px; padding:10px 12px;
    border:1px solid var(--border); background:var(--panel); color:var(--ink);
  }
  .searchrow input:focus{ outline:2px solid var(--accent); outline-offset:-1px; }

  .empty{ padding:40px 16px; text-align:center; border:1px dashed var(--border); background:var(--panel); }
  .empty p{ margin:4px 0; color:var(--muted); font-size:14px; }
  .empty strong{ font-family:'Oswald', sans-serif; text-transform:uppercase; font-size:16px; color:var(--ink); }

  .card{ background:var(--panel); border:1px solid var(--border); margin-bottom:10px; position:relative; }
  .card.lowstock{ border:2px solid var(--alert); background:#fbeae7; }
  .card.lowstock .name{ color:var(--alert); }
  .card:not(.lowstock){ border-left:4px solid var(--ink); }

  .card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:14px 14px 8px; }
  .card-head .name{ font-family:'Oswald', sans-serif; font-weight:600; font-size:19px; text-transform:uppercase; letter-spacing:0.01em; }
  .card-head .unit{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); margin-top:2px; }
  .card-head .kitline{ font-size:12px; color:var(--muted); margin-top:5px; line-height:1.5; }
  .card-head .kitline b{ color:var(--ink); font-weight:600; }
  .iconbtn{ background:none; border:none; color:var(--muted); font-size:13px; font-family:'IBM Plex Sans', sans-serif; cursor:pointer; padding:4px 6px; }
  .iconbtn:hover{ color:var(--ink); }

  .qtyrow{ display:grid; grid-template-columns:1fr 1fr; gap:0; border-top:1px dashed var(--border); }
  .qtyblock{ padding:12px 14px; }
  .qtyblock:first-child{ border-right:1px dashed var(--border); }
  .qtyblock .lbl{ font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .qtyblock .val{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:24px; }
  .qtyblock.ready .val{ color:var(--ready); }
  .qtyblock.build .val{ color:var(--build); }
  .qtyblock .val small{ font-size:13px; font-weight:500; color:var(--muted); margin-left:2px;}

  .actions{ display:flex; flex-wrap:wrap; gap:8px; padding:0 14px 14px; }
  .actbtn{
    font-family:'IBM Plex Sans', sans-serif; font-size:13px; font-weight:600;
    padding:8px 12px; border:1px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer;
  }
  .actbtn.primary{ background:var(--build); border-color:var(--build); color:#fff; }
  .actbtn.shift{ background:var(--ready); border-color:var(--ready); color:#fff; }
  .actbtn.dispatch{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .actbtn:disabled{ opacity:0.35; cursor:not-allowed; }

  .inline-form{
    padding:12px 14px; border-top:1px dashed var(--border); background:#eef0ee;
    display:flex; flex-wrap:wrap; align-items:flex-start; gap:8px;
  }
  .inline-form label{ font-size:12px; color:var(--muted); width:100%; }
  .inline-form input[type=number]{
    font-family:'IBM Plex Mono', monospace; font-size:16px; padding:8px 10px; border:1px solid var(--border); width:110px;
  }
  .inline-form .go{ background:var(--ink); color:#fff; border:none; padding:9px 14px; font-weight:600; font-size:13px; cursor:pointer; }
  .inline-form .cancel{ background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:9px 6px; }
  .inline-form .hint{ width:100%; font-size:11px; color:var(--muted); font-family:'IBM Plex Sans', sans-serif; }
  .subfield{ display:flex; flex-direction:column; gap:3px; }
  .subfield span{ font-size:11px; color:var(--muted); }
  .subfield input[type=text], .subfield input[type=date]{ font-family:'IBM Plex Sans', sans-serif; font-size:14px; width:150px; padding:8px 10px; border:1px solid var(--border); }
  .optional{ font-weight:400; text-transform:none; letter-spacing:0; color:var(--muted); }

  .kitbox{ width:100%; border:1px solid var(--border); background:#fff; padding:10px 12px; margin-top:2px; }
  .kitbox .fk-row{ display:flex; align-items:center; gap:8px; font-size:13px; }
  .kitbox .parts{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); }
  .kitbox .parts label{ display:flex; align-items:center; gap:7px; font-size:13px; width:auto; color:var(--ink); margin-bottom:6px; }
  .kitbox .parts .ph{ font-size:11px; color:var(--muted); margin-bottom:6px; width:100%; }

  .histbtn{ background:none; border:none; color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; padding:0 14px 12px; }
  .history-panel{ border-top:1px dashed var(--border); padding:10px 14px 14px; background:#eef0ee; }
  .history-panel .htitle{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-bottom:8px; }
  .history-empty{ font-size:13px; color:var(--muted); }
  .hist-row{ padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .hist-row:last-child{ border-bottom:none; }
  .hist-top{ display:flex; justify-content:space-between; gap:10px; }
  .hist-row .hqty{ font-family:'IBM Plex Mono', monospace; font-weight:600; color:var(--accent); white-space:nowrap; }
  .hist-row .hpo{ color:var(--ink); }
  .hist-row .hpo.none{ color:var(--muted); font-style:italic; }
  .hist-row .hdate{ color:var(--muted); white-space:nowrap; font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .hist-kit{ margin-top:3px; font-size:12px; }
  .hist-kit.full{ color:var(--ready); }
  .hist-kit.partial{ color:var(--alert); }

  .field-note{ font-size:11px; color:var(--muted); margin:-10px 0 14px; }

  .chiplist{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip{ display:flex; align-items:center; gap:6px; background:#e7eae9; border:1px solid var(--border); padding:5px 8px 5px 10px; font-size:13px; }
  .chip button{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; line-height:1; padding:0; }
  .chip button:hover{ color:var(--alert); }
  .addpart-row{ display:flex; gap:8px; margin-top:6px; }
  .addpart-row input{ flex:1; font-family:'IBM Plex Sans', sans-serif; font-size:14px; padding:9px 10px; border:1px solid var(--border); }
  .addpart-row button{ background:var(--ink); color:#fff; border:none; padding:0 14px; font-size:13px; font-weight:600; cursor:pointer; }
  .addpart-hint{ font-size:11px; color:var(--muted); margin-top:5px; }

  .sort-select{min-height:44px;border:1px solid var(--border);background:var(--panel);color:var(--ink);border-radius:14px;padding:0 12px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;}
  .searchrow{align-items:stretch;} .searchbox{min-width:0;}
  .card{border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;} .card:active{transform:scale(.995);}
  .card .iconbtn,.card .actbtn,.card .histbtn{position:relative;z-index:3;}
  .detail-modal{max-width:560px;} .detail-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px;}
  .detail-name{font-family:'Oswald',sans-serif;font-size:24px;font-weight:600;text-transform:uppercase;line-height:1.15;}
  .detail-dwg{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:12px;margin-top:5px;word-break:break-all;}
  .detail-close{border:0;background:#eef1f5;border-radius:12px;width:42px;height:42px;font-size:22px;cursor:pointer;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;} .detail-stat{border:1px solid var(--border);border-radius:14px;padding:12px;background:#fff;}
  .detail-stat .dl{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em;} .detail-stat .dv{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;margin-top:3px;}
  .detail-section{margin-top:16px;border-top:1px solid var(--border);padding-top:14px;} .detail-section h3{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:15px;margin:0 0 10px;}
  .attachment-list{display:flex;flex-direction:column;gap:8px;} .attachment-row{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:13px;padding:10px;background:#fff;}

/* ---------------- BOOT ---------------- */

function boot(){
  loadData();
}

/* ---------------- DATA ---------------- */

async function loadData(){
  try{
    if(window.storage && typeof window.storage.get==='function'){
      const res=await window.storage.get(PRODUCTS_KEY,true); products=res&&res.value?JSON.parse(res.value):[];
    }else{ const raw=localStorage.getItem(PRODUCTS_KEY); products=raw?JSON.parse(raw):[]; }
  }catch(e){ try{const raw=localStorage.getItem(PRODUCTS_KEY); products=raw?JSON.parse(raw):[];}catch(_){products=[];} }
  let changed=false;
  const partNos=new Set(products.map(p=>(p.partNo||'').toLowerCase()).filter(Boolean));
  IMPORTED_PRODUCTS.forEach(x=>{
    const dup=(x.partNo&&partNos.has(x.partNo.toLowerCase()))||products.some(p=>(p.name||'').toLowerCase()===(x.name||'').toLowerCase());
    if(!dup){products.push(Object.assign({id:uid(),history:[],attachments:[],createdAt:Date.now()},x));if(x.partNo)partNos.add(x.partNo.toLowerCase());changed=true;}
  });
  products.forEach(p=>{if(!p.createdAt)p.createdAt=Date.now();if(!p.attachments)p.attachments=[];});
  if(changed) await saveData();
  productsLoaded=true; render();
}
async function saveData(){
  const serialized=JSON.stringify(products);
  try{
    if(window.storage && typeof window.storage.set==='function') await window.storage.set(PRODUCTS_KEY,serialized,true);
    else localStorage.setItem(PRODUCTS_KEY,serialized);
  }catch(e){ try{localStorage.setItem(PRODUCTS_KEY,serialized);}catch(_){} }
}

/* ---------------- MAIN RENDER ---------------- */

function render(){
  const app = document.getElementById('app');
  if(!productsLoaded){ app.innerHTML = '<div class="loading">Loading register…</div>'; return; }

  const total = products.length;
  const lowCount = products.filter(p => p.storeQty <= LOW_STOCK_MAX).length;
  const buildCount = products.filter(p => p.buildQty > 0).length;

  const filtered = getFilteredProducts();

  let html = '';
  html += '<header class="top">';
  html += '  <div class="brand"><div class="tag">Stock Register</div><h1>Inventory Management</h1><div class="sub">Store room &amp; build process</div></div>';
  html += '  <div class="top-right">';
  html += '    <button class="add-btn" onclick="openNewProduct()">+ Add Product</button>';
  html += '  </div>';
  html += '</header>';

  html += '<div class="stats">';
  html += `  <div class="stat"><div class="num">${total}</div><div class="lbl">Products tracked</div></div>`;
  html += `  <div class="stat"><div class="num">${buildCount}</div><div class="lbl">In build process</div></div>`;
  html += `  <div class="stat alertstat"><div class="num">${lowCount}</div><div class="lbl">Low on store stock</div></div>`;
  html += '</div>';

  html += '<div class="searchrow"><div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="main-search" type="search" value="' + esc(searchTerm) + '" oninput="onSearch(this.value)" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search products..."></div><select class="sort-select" onchange="changeSort(this.value)"><option value="name" '+(sortMode==='name'?'selected':'')+'>Name A–Z</option><option value="name-desc" '+(sortMode==='name-desc'?'selected':'')+'>Name Z–A</option><option value="newest" '+(sortMode==='newest'?'selected':'')+'>Newly added</option><option value="oldest" '+(sortMode==='oldest'?'selected':'')+'>Oldest added</option></select></div>';
  html += '<div class="search-hint">Searches product name, drawing/part no., and sub-part drawing/part no.</div>';

  html += '<div id="inventory-results">';
  html += renderResults(filtered);
  html += '</div>';

  app.innerHTML = html;

  if(editModal){ renderEditModal(); }
  if(confirmDelete){ renderDeleteModal(); }
  if(openDetail){ app.insertAdjacentHTML('beforeend', renderDetailModal()); }
}

/* ---------------- PRODUCT CARD ---------------- */

function renderCard(p){
  const low = p.storeQty <= LOW_STOCK_MAX;
  let html = `<div class="card ${low ? 'lowstock' : ''}" onclick="openProductDetail('${p.id}')">`;
  html += '  <div class="card-head">';
  html += '    <div>';
  html += `      <div class="name">${esc(p.name)}</div>`;
  if(p.partNo){
    html += `      <div class="unit">${esc(p.partNo)}</div>`;
  }
  html += '    </div>';
  html += `    <div><button class="iconbtn" onclick="event.stopPropagation();openEditProduct('${p.id}')">Edit</button><button class="iconbtn" onclick="event.stopPropagation();askDelete('${p.id}')">Delete</button></div>`;
  html += '  </div>';

  html += '  <div class="qtyrow">';
  html += `    <div class="qtyblock ready"><div class="lbl">Ready in store</div><div class="val">${p.storeQty}<small>${esc(p.unit)}</small></div></div>`;
  html += `    <div class="qtyblock build"><div class="lbl">In build process</div><div class="val">${p.buildQty}<small>${esc(p.unit)}</small></div></div>`;
  html += '  </div>';

  html += '  <div class="actions">';
  html += `    <button class="actbtn primary" onclick="event.stopPropagation();toggleQtyForm('${p.id}','tobuild')">Send to build</button>`;
  html += `    <button class="actbtn shift" onclick="event.stopPropagation();toggleQtyForm('${p.id}','shift')" ${p.buildQty<=0?'disabled':''}>Shift to store</button>`;
  html += `    <button class="actbtn dispatch" onclick="event.stopPropagation();toggleQtyForm('${p.id}','dispatch')" ${p.storeQty<=0?'disabled':''}>Dispatch order</button>`;
  html += '  </div>';

  const histCount = (p.history || []).length;
  html += `  <button class="histbtn" onclick="event.stopPropagation();toggleHistory('${p.id}')">${openHistory===p.id ? 'Hide' : 'View'} dispatch history${histCount ? ' (' + histCount + ')' : ''}</button>`;

  if(openQtyForm && openQtyForm.id === p.id){ html += renderQtyForm(p, openQtyForm.mode); }
  if(openHistory === p.id){ html += renderHistoryPanel(p); }

  html += '</div>';
  return html;
}

function renderHistoryPanel(p){
  const hist = (p.history || []).slice().sort((a,b) => (b.ts||0) - (a.ts||0));
  let html = '<div class="history-panel"><div class="htitle">Dispatch history</div>';
  if(hist.length === 0){
    html += '<div class="history-empty">No dispatches recorded yet.</div>';
  } else {
    hist.forEach(h => {
      html += '<div class="hist-row">';
      html += '<div class="hist-top">';
      html += `<span class="hqty">${h.qty} ${esc(p.unit)}</span>`;
      html += `<span class="hpo ${h.po ? '' : 'none'}">${h.po ? 'PO ' + esc(h.po) : 'No PO'}</span>`;
      html += `<span class="hdate">${formatDate(h.date)}</span>`;
      html += '</div>';
      if(h.excluded && h.excluded.length){
        html += `<div class="hist-kit partial">All items except: ${h.excluded.map(esc).join(', ')}</div>`;
      } else if(p.subParts && p.subParts.length){
        html += `<div class="hist-kit full">Full kit</div>`;
      }
      html += '</div>';
    });
  }
  html += '</div>';
  return html;
}

/* ---------------- QTY FORM (build / shift / dispatch) ---------------- */

function renderQtyForm(p, mode){
  let label = '', max = null, hint = '';
  if(mode === 'tobuild'){
    label = 'Qty being sent for fabrication';
    hint = 'Adds to "in build process" for ' + esc(p.name) + '.';
  } else if(mode === 'shift'){
    label = 'Qty completed, shift to store';
    max = p.buildQty;
    hint = 'Moves from build process into ready store stock. Max ' + p.buildQty + ' ' + esc(p.unit) + '.';
  } else if(mode === 'dispatch'){
    label = 'Qty going out (order dispatched)';
    max = p.storeQty;
    hint = 'Reduces ready store stock. Max ' + p.storeQty + ' ' + esc(p.unit) + '.';
  }
  let html = '<div class="inline-form">';
  html += `<label>${label}</label>`;
  html += `<input type="number" min="1" ${max!==null?'max="'+max+'"':''} id="qtyinput_${p.id}" inputmode="numeric">`;

  if(mode === 'dispatch'){
    html += `<div class="subfield"><span>PO number <span class="optional">(optional)</span></span><input type="text" id="poinput_${p.id}"></div>`;
    html += `<div class="subfield"><span>Dispatch date</span><input type="date" id="dateinput_${p.id}" value="${todayStr()}"></div>`;

    if(p.subParts && p.subParts.length){
      html += '<div class="kitbox">';
      html += `<div class="fk-row"><input type="checkbox" id="fullkit_${p.id}" checked onchange="onFullKitToggle('${p.id}')"> <label style="width:auto;">Full kit going (all parts included)</label></div>`;
      html += `<div class="parts" id="kitparts_${p.id}" style="display:none;">`;
      html += '<div class="ph">Tick the part(s) that are NOT going in this dispatch:</div>';
      p.subParts.forEach(sp => {
        html += `<label><input type="checkbox" class="kitpart_${p.id}" value="${esc(sp.name)}"> ${esc(sp.name)}</label>`;
      });
      html += '</div></div>';
    }
  }

  html += `<button class="go" onclick="submitQtyForm('${p.id}','${mode}')">Confirm</button>`;
  html += `<button class="cancel" onclick="closeQtyForm()">Cancel</button>`;
  html += `<div class="hint">${hint}${mode==='dispatch' ? ' PO number is optional — leave blank if dispatching without one.' : ''}</div>`;
  html += '</div>';
  return html;
}

function onFullKitToggle(id){
  const fk = document.getElementById('fullkit_' + id);
  const box = document.getElementById('kitparts_' + id);
  if(!fk || !box) return;
  box.style.display = fk.checked ? 'none' : 'block';
}

function toggleQtyForm(id, mode){
  if(openQtyForm && openQtyForm.id === id && openQtyForm.mode === mode){
    openQtyForm = null;
  } else {
    openQtyForm = { id, mode };
    openHistory = null;
  }
  render();
  setTimeout(() => { const el = document.getElementById('qtyinput_' + id); if(el) el.focus(); }, 30);
}
function closeQtyForm(){ openQtyForm = null; render(); }

function submitQtyForm(id, mode){
  const input = document.getElementById('qtyinput_' + id);
  const qty = parseInt(input.value, 10);
  if(!qty || qty <= 0){ input.focus(); return; }
  const p = products.find(x => x.id === id);
  if(!p) return;

  if(mode === 'tobuild'){
    p.buildQty += qty;
  } else if(mode === 'shift'){
    const amt = Math.min(qty, p.buildQty);
    p.buildQty -= amt;
    p.storeQty += amt;
  } else if(mode === 'dispatch'){
    const amt = Math.min(qty, p.storeQty);
    p.storeQty -= amt;
    const poEl = document.getElementById('poinput_' + id);
    const dateEl = document.getElementById('dateinput_' + id);
    const po = poEl ? poEl.value.trim() : '';
    const date = (dateEl && dateEl.value) ? dateEl.value : todayStr();

    let excluded = [];
    if(p.subParts && p.subParts.length){
      const fk = document.getElementById('fullkit_' + id);
      const isFull = fk ? fk.checked : true;
      if(!isFull){
        const checks = document.querySelectorAll('#kitparts_' + id + ' input:checked');
        excluded = Array.from(checks).map(c => c.value);
      }
    }
    if(!p.history) p.history = [];
    p.history.push({ id: uid(), qty: amt, po, date, ts: Date.now(), excluded });
  }
  openQtyForm = null;
  saveData();
  render();
}

function getFilteredProducts(){
  let filtered = products;
  const t = searchTerm.trim().toLowerCase();
  if(!t) return filtered;
  return products.filter(p => {
    if((p.name || '').toLowerCase().includes(t)) return true;
    if(p.partNo && p.partNo.toLowerCase().includes(t)) return true;
    if(p.subParts && p.subParts.some(sp =>
      (sp.name && sp.name.toLowerCase().includes(t)) ||
      (sp.partNo && sp.partNo.toLowerCase().includes(t))
    )) return true;
    return false;
  });
}

function renderResults(filtered){
  let html = '';
  if(products.length === 0){
    html += '<div class="empty"><p><strong>Register is empty</strong></p><p>Add your first product to start tracking store room and build-process quantities.</p></div>';
  } else if(filtered.length === 0){
    html += '<div class="empty"><p><strong>No match</strong></p><p>No product name or drawing/part number matches your search.</p></div>';
  } else {
    filtered.slice().sort((a,b) => {
      if(sortMode==='newest') return (b.createdAt||0)-(a.createdAt||0);
      if(sortMode==='oldest') return (a.createdAt||0)-(b.createdAt||0);
      const dir=sortMode==='name-desc'?-1:1;
      return (a.name||'').localeCompare(b.name||'',undefined,{numeric:true,sensitivity:'base'})*dir;
    }).forEach(p => { html += renderCard(p); });
  }
  return html;
}

function onSearch(v){
  searchTerm = v;
  // Do NOT re-render the whole app here. Replacing the input element on every
  // keystroke makes iOS Safari/Home Screen Web Apps dismiss the keyboard.
  const results = document.getElementById('inventory-results');
  if(results){
    results.innerHTML = renderResults(getFilteredProducts());
  }
}
function toggleHistory(id){ openHistory = openHistory === id ? null : id; openQtyForm = null; render(); }

/* ---------------- DETAILS + DRAWING FILES ---------------- */
const FILE_DB_NAME='mexo_inventory_files_v1'; let fileDBPromise=null;
function getFileDB(){if(fileDBPromise)return fileDBPromise;fileDBPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(FILE_DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files');};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});return fileDBPromise;}
async function putAttachmentBlob(key,blob){const db=await getFileDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
async function getAttachmentBlob(key){const db=await getFileDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readonly');const r=tx.objectStore('files').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function deleteAttachmentBlob(key){try{const db=await getFileDB();db.transaction('files','readwrite').objectStore('files').delete(key);}catch(e){}}
function fileKey(pid,fid){return pid+'::'+fid;} function formatBytes(n){if(!n)return '0 KB';if(n<1048576)return Math.max(1,Math.round(n/1024))+' KB';return (n/1048576).toFixed(1)+' MB';}
function changeSort(v){sortMode=v;render();} function openProductDetail(id){openDetail=id;render();} function closeProductDetail(){openDetail=null;render();}
function renderAttachmentRows(p,editable=false){const files=p.attachments||[];if(!files.length)return '<div class="attach-empty">No PDF, DXF or DWG files attached yet.</div>';return '<div class="attachment-list">'+files.map(f=>{const ext=(f.name.split('.').pop()||'').toUpperCase();return `<div class="attachment-row"><div class="attachment-info"><div class="attachment-name">${esc(f.name)}</div><div class="attachment-type">${ext||'FILE'} • ${formatBytes(f.size)}</div></div>${ext==='PDF'?`<button class="file-btn primary" onclick="event.stopPropagation();previewAttachment('${p.id}','${f.id}')">View</button>`:''}<button class="file-btn" onclick="event.stopPropagation();downloadAttachment('${p.id}','${f.id}')">Download</button>${editable?`<button class="file-btn" onclick="event.stopPropagation();removeAttachment('${f.id}')">Remove</button>`:''}</div>`;}).join('')+'</div>';}
function renderDetailModal(){const p=products.find(x=>x.id===openDetail);if(!p)return '';let h='<div class="overlay" onclick="if(event.target===this)closeProductDetail()"><div class="modal detail-modal">';h+='<div class="detail-top"><div><div class="detail-name">'+esc(p.name)+'</div><div class="detail-dwg">'+esc(p.partNo||'No drawing / part number')+'</div></div><button class="detail-close" onclick="closeProductDetail()">×</button></div>';h+='<div class="detail-grid"><div class="detail-stat"><div class="dl">Ready in store</div><div class="dv">'+(p.storeQty||0)+' '+esc(p.unit||'pcs')+'</div></div><div class="detail-stat"><div class="dl">In build process</div><div class="dv">'+(p.buildQty||0)+' '+esc(p.unit||'pcs')+'</div></div></div>';h+='<div class="detail-section"><h3>Sub items</h3>'+(p.subParts&&p.subParts.length?'<div class="subparts-detail">'+p.subParts.map(sp=>`<div class="subpart-detail-row"><span>${esc(sp.name)}</span><span>${esc(sp.partNo||'No drawing no.')}</span></div>`).join('')+'</div>':'<div class="attach-empty">No sub items added.</div>')+'</div>';h+='<div class="detail-section"><h3>Drawing files ('+(p.attachments||[]).length+')</h3>'+renderAttachmentRows(p)+'</div>';h+='<div class="modal-actions"><button class="btn-cancel" onclick="closeProductDetail()">Back</button><button class="btn-save" onclick="closeProductDetail();openEditProduct(\''+p.id+'\')">Edit product</button></div></div></div>';return h;}
async function previewAttachment(pid,fid){const p=products.find(x=>x.id===pid),f=p&&p.attachments&&p.attachments.find(x=>x.id===fid);if(!f)return;const ext=(f.name.split('.').pop()||'').toLowerCase();if(ext!=='pdf'){alert('DXF/DWG preview is not supported directly in the iPhone browser. Use Download to open it in a CAD app.');return;}const blob=await getAttachmentBlob(fileKey(pid,fid));if(!blob){alert('File data is not available.');return;}const url=URL.createObjectURL(blob),ov=document.createElement('div');ov.className='overlay';ov.innerHTML='<div class="modal preview-modal"><div class="detail-top"><div class="detail-name" style="font-size:18px;">'+esc(f.name)+'</div><button class="detail-close" id="close-preview">×</button></div><iframe class="preview-frame" src="'+url+'" title="PDF preview"></iframe></div>';document.body.appendChild(ov);const close=()=>{URL.revokeObjectURL(url);ov.remove();};document.getElementById('close-preview').onclick=close;ov.onclick=e=>{if(e.target===ov)close();};}
async function downloadAttachment(pid,fid){const p=products.find(x=>x.id===pid),f=p&&p.attachments&&p.attachments.find(x=>x.id===fid);if(!f)return;const blob=await getAttachmentBlob(fileKey(pid,fid));if(!blob){alert('File data is not available.');return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=f.name;a.target='_blank';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
async function uploadFiles(input){const files=Array.from(input.files||[]);if(!files.length||!editModal)return;if(!editModal.id&&!editModal.tempId)editModal.tempId=uid();const pid=editModal.id||editModal.tempId;if(!editModal.attachments)editModal.attachments=[];for(const file of files){const ext=(file.name.split('.').pop()||'').toLowerCase();if(!['pdf','dxf','dwg'].includes(ext))continue;const id=uid();await putAttachmentBlob(fileKey(pid,id),file);editModal.attachments.push({id,name:file.name,size:file.size,type:file.type||ext,addedAt:Date.now()});}render();}
async function removeAttachment(fid){if(!editModal||!editModal.attachments)return;const pid=editModal.id||editModal.tempId,f=editModal.attachments.find(x=>x.id===fid);if(f)await deleteAttachmentBlob(fileKey(pid,fid));editModal.attachments=editModal.attachments.filter(x=>x.id!==fid);render();}

/* ---------------- ADD / EDIT PRODUCT ---------------- */

function openNewProduct(){
  editModal = { id:null, tempId:uid(), name:'', partNo:'', unit:'pcs', storeQty:'', buildQty:'', subParts:[], attachments:[], isNew:true };
  render();
}
function openEditProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  editModal = Object.assign({}, p, { subParts: (p.subParts||[]).map(sp => Object.assign({}, sp)), attachments:(p.attachments||[]).map(f=>Object.assign({},f)), isNew:false });
  render();
}
function closeEditModal(){ editModal = null; render(); }

function renderEditModal(){
  const m = editModal;
  const app = document.getElementById('app');
  let html = '<div class="overlay" onclick="if(event.target===this) closeEditModal()"><div class="modal">';
  html += `<h2>${m.isNew ? 'Add Product' : 'Edit Product'}</h2>`;
  html += '<div class="field"><label>Product name</label><input type="text" id="f_name" value="' + esc(m.name) + '" oninput="editModal.name=this.value"></div>';
  html += '<div class="field"><label>Drawing no. / Part no. <span style="text-transform:none;letter-spacing:0;">(optional)</span></label><input type="text" id="f_partno" value="' + esc(m.partNo || '') + '" oninput="editModal.partNo=this.value"></div>';
  html += '<div class="field-row">';
  html += '<div class="field"><label>Unit</label><input type="text" id="f_unit" value="' + esc(m.unit) + '" oninput="editModal.unit=this.value"></div>';
  html += '<div class="field"><label>Ready in store</label><input type="number" min="0" id="f_store" value="' + esc(m.storeQty) + '" oninput="editModal.storeQty=this.value"></div>';
  html += '</div>';
  html += '<div class="field-row">';
  html += '<div class="field"><label>In build process</label><input type="number" min="0" id="f_build" value="' + esc(m.buildQty) + '" oninput="editModal.buildQty=this.value"></div>';
  html += '<div class="field"></div>';
  html += '</div>';
  if(!m.isNew){
    html += '<div class="field-note">Correcting these directly overwrites the quantities — use this if a shift or entry was done by mistake.</div>';
  }

  html += '<div class="field"><label>Kit components <span style="text-transform:none;letter-spacing:0;">(optional — only if this product is made of separate parts)</span></label>';
  html += '<div class="addpart-row"><input type="text" id="f_newpart" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addSubPart();}"><input type="text" id="f_newpartno" style="max-width:140px;" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addSubPart();}"><button type="button" onclick="addSubPart()">Add part</button></div>';
  html += '<div class="addpart-hint">Part name, then its drawing/part no. (optional)</div>';
  html += '<div class="chiplist">';
  (m.subParts||[]).forEach((sp, idx) => {
    const label = esc(sp.name) + (sp.partNo ? ' — ' + esc(sp.partNo) : '');
    html += `<div class="chip">${label}<button type="button" onclick="removeSubPart(${idx})">×</button></div>`;
  });
  html += '</div></div>';

  html += '<div class="field"><label>Drawing files</label><div class="file-drop"><input type="file" multiple accept=".pdf,.dxf,.dwg,application/pdf" onchange="uploadFiles(this)"><div class="file-note">Upload multiple PDF, DXF and DWG files for this product. They stay attached to this drawing.</div></div>'+renderAttachmentRows(Object.assign({},m,{attachments:m.attachments||[]}),true)+'</div>';
  html += '<div class="err" id="f_err" style="display:none;"></div>';
  html += '<div class="modal-actions">';
  html += '<button class="btn-cancel" onclick="closeEditModal()">Cancel</button>';
  html += `<button class="btn-save" onclick="saveProductForm()">${m.isNew ? 'Add product' : 'Save changes'}</button>`;
  html += '</div></div></div>';
  app.insertAdjacentHTML('beforeend', html);
}

function addSubPart(){
  const inp = document.getElementById('f_newpart');
  const partnoInp = document.getElementById('f_newpartno');
  const val = inp.value.trim();
  const partNo = partnoInp ? partnoInp.value.trim() : '';
  if(!val) return;
  if(!editModal.subParts) editModal.subParts = [];
  editModal.subParts.push({ id: uid(), name: val, partNo });
  render();
  setTimeout(() => { const el = document.getElementById('f_newpart'); if(el) el.focus(); }, 30);
}
function removeSubPart(idx){
  editModal.subParts.splice(idx, 1);
  render();
}

function saveProductForm(){
  const name = document.getElementById('f_name').value.trim();
  const partNo = document.getElementById('f_partno').value.trim();
  const unit = document.getElementById('f_unit').value.trim() || 'pcs';
  const store = parseInt(document.getElementById('f_store').value, 10) || 0;
  const build = parseInt(document.getElementById('f_build').value, 10) || 0;
  const errEl = document.getElementById('f_err');

  if(!name){ errEl.textContent = 'Product name is required.'; errEl.style.display = 'block'; return; }

  if(editModal.isNew){
    const dup = products.some(p => p.name.toLowerCase() === name.toLowerCase());
    if(dup){ errEl.textContent = 'A product with this name already exists.'; errEl.style.display = 'block'; return; }
    products.push({ id: editModal.tempId || uid(), name, partNo, unit, storeQty: store, buildQty: build, subParts: editModal.subParts || [], history: [], attachments: editModal.attachments || [], createdAt: Date.now() });
  } else {
    const p = products.find(x => x.id === editModal.id);
    if(p){
      p.name = name; p.partNo = partNo; p.unit = unit;
      p.storeQty = store; p.buildQty = build;
      p.subParts = editModal.subParts || [];
      p.attachments = editModal.attachments || [];
    }
  }
  editModal = null;
  saveData();
  render();
}

function askDelete(id){ confirmDelete = id; render(); }
function cancelDelete(){ confirmDelete = null; render(); }
function renderDeleteModal(){
  const p = products.find(x => x.id === confirmDelete);
  const app = document.getElementById('app');
  if(!p) return;
  let html = '<div class="overlay" onclick="if(event.target===this) cancelDelete()"><div class="modal">';
  html += '<h2>Delete product</h2>';
  html += `<p style="font-size:14px; color:var(--muted); margin-top:-8px;">Remove "${esc(p.name)}" from the register? This deletes its store, build-process and dispatch history. This can't be undone.</p>`;
  html += '<div class="modal-actions">';
  html += '<button class="btn-cancel" onclick="cancelDelete()">Cancel</button>';
  html += `<button class="btn-danger" onclick="doDelete()">Delete</button>`;
  html += '</div></div></div>';
  app.insertAdjacentHTML('beforeend', html);
}
async function doDelete(){
  const doomed=products.find(x=>x.id===confirmDelete);if(doomed&&doomed.attachments)for(const f of doomed.attachments)await deleteAttachmentBlob(fileKey(doomed.id,f.id));
  products = products.filter(x => x.id !== confirmDelete);
  confirmDelete = null;
  saveData();
  render();
}

boot();
</script>
