<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mexo Inventory">
<meta name="theme-color" content="#1b2024">
<style>
  :root{
    --bg:#e4e7e9;
    --panel:#f6f7f7;
    --ink:#1b2024;
    --muted:#5c6770;
    --border:#c4cbd0;
    --ready:#1f6f52;
    --build:#b1720f;
    --alert:#a83b2a;
    --accent:#2b4a5e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{ max-width:860px; margin:0 auto; padding:20px 16px 80px; }

  header.top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    padding-bottom:16px;
    border-bottom:3px solid var(--ink);
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--muted);
  }
  .brand h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:28px;
    text-transform:uppercase;
    letter-spacing:0.01em;
    margin:0;
    line-height:1.05;
  }
  .brand .sub{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }
  .top-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .whoami{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
  }
  .add-btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    background:var(--ink);
    color:#fff;
    border:none;
    padding:11px 18px;
    cursor:pointer;
    white-space:nowrap;
  }
  .add-btn:active{ transform:translateY(1px); }
  .linkbtn{
    background:none;
    border:none;
    color:var(--accent);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    padding:4px 2px;
  }

  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    margin-bottom:18px;
  }
  .stat{ background:var(--panel); padding:12px 14px; }
  .stat .num{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:22px; }
  .stat .lbl{ font-size:12px; color:var(--muted); margin-top:2px; }
  .stat.alertstat .num{ color:var(--alert); }

  .searchrow{ display:flex; gap:8px; margin-bottom:18px; }
  .searchrow input{
    flex:1;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    padding:10px 12px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--ink);
  }
  .searchrow input:focus{ outline:2px solid var(--accent); outline-offset:-1px; }

  .empty{
    padding:40px 16px;
    text-align:center;
    border:1px dashed var(--border);
    background:var(--panel);
  }
  .empty p{ margin:4px 0; color:var(--muted); font-size:14px; }
  .empty strong{ font-family:'Oswald', sans-serif; text-transform:uppercase; font-size:16px; color:var(--ink); }

  .card{ background:var(--panel); border:1px solid var(--border); margin-bottom:10px; position:relative; }
  .card.lowstock{ border-left:4px solid var(--alert); }
  .card:not(.lowstock){ border-left:4px solid var(--ink); }

  .card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:14px 14px 8px; }
  .card-head .name{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:19px;
    text-transform:uppercase;
    letter-spacing:0.01em;
  }
  .card-head .unit{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); margin-top:2px; }
  .card-head .kitline{ font-size:12px; color:var(--muted); margin-top:5px; line-height:1.5; }
  .card-head .kitline b{ color:var(--ink); font-weight:600; }
  .iconbtn{
    background:none; border:none; color:var(--muted); font-size:13px;
    font-family:'IBM Plex Sans', sans-serif; cursor:pointer; padding:4px 6px;

<script>
const AUTH_KEY = 'mexo_auth_v1';
const PRODUCTS_KEY = 'mexo_products_v1';

let authState = 'loading'; // loading | setup | login | app
let authConfig = null;
let loggedIn = false;
let currentUser = '';
let loginError = '';
let changeLoginOpen = false;
let changeLoginError = '';

let products = [];
let productsLoaded = false;
let openQtyForm = null;
let editModal = null;
let confirmDelete = null;
let searchTerm = '';
let openHistory = null;

function uid(){ return 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function formatDate(iso){
  if(!iso) return '';
  const parts = iso.split('-');
  if(parts.length !== 3) return iso;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return parts[2] + ' ' + months[parseInt(parts[1],10)-1] + ' ' + parts[0];
}

/* ---------------- BOOT / AUTH ---------------- */

async function boot(){
  try{
    const res = await window.storage.get(AUTH_KEY, true);
    authConfig = res && res.value ? JSON.parse(res.value) : null;
  }catch(e){
    authConfig = null;
  }
  authState = authConfig ? 'login' : 'setup';
  renderAuth();
}

function renderAuth(){
  const app = document.getElementById('app');
  let html = '<div class="auth-wrap"><div class="auth-card">';
  html += '<div class="tag">MEXO INDUSTRIES</div>';

  if(authState === 'setup'){
    html += '<h1>Set Up Access</h1>';
    html += '<p class="desc">No login is set for this register yet. Create one login that you and anyone you share this app with (e.g. Nana) will use — everyone signed in sees the same live stock data.</p>';
    html += '<div class="field"><label>Username</label><input type="text" id="su_user" placeholder="e.g. mexo"></div>';
    html += '<div class="field"><label>Password</label><input type="password" id="su_pass" placeholder="Choose a password"></div>';
    html += '<div class="field"><label>Confirm password</label><input type="password" id="su_pass2" placeholder="Re-enter password"></div>';
    html += '<div class="err" id="auth_err" style="display:none;"></div>';
    html += '<button class="btn-save" onclick="doSetup()">Create login &amp; continue</button>';
    html += '<div class="auth-note">This is a simple shared login for keeping the register private to your team — not bank-grade security. Anyone with this username and password, opening this same app link, can view and edit stock.</div>';
  } else if(authState === 'login'){
    html += '<h1>Sign In</h1>';
    html += '<p class="desc">Enter the login for the Mexo Industries stock register.</p>';
    html += '<div class="field"><label>Username</label><input type="text" id="li_user" placeholder="Username" onkeydown="if(event.key===\'Enter\') doLogin()"></div>';
    html += '<div class="field"><label>Password</label><input type="password" id="li_pass" placeholder="Password" onkeydown="if(event.key===\'Enter\') doLogin()"></div>';
    if(loginError){ html += '<div class="err">' + esc(loginError) + '</div>'; }
    html += '<button class="btn-save" onclick="doLogin()">Sign in</button>';
    html += '<div class="auth-note">Ask whoever set up this register for the username and password.</div>';
  }

  html += '</div></div>';
  app.innerHTML = html;
}

async function doSetup(){
  const u = document.getElementById('su_user').value.trim();
  const p1 = document.getElementById('su_pass').value;
  const p2 = document.getElementById('su_pass2').value;
  const errEl = document.getElementById('auth_err');
  if(!u || !p1){ errEl.textContent = 'Username and password are required.'; errEl.style.display='block'; return; }
  if(p1 !== p2){ errEl.textContent = 'Passwords do not match.'; errEl.style.display='block'; return; }
  authConfig = { username: u, password: p1 };
  try{
    await window.storage.set(AUTH_KEY, JSON.stringify(authConfig), true);
  }catch(e){
    errEl.textContent = 'Could not save login, please try again.'; errEl.style.display='block'; return;
  }
  currentUser = u;
  loggedIn = true;
  authState = 'app';
  await loadData();
}

function doLogin(){
  const u = document.getElementById('li_user').value.trim();
  const p = document.getElementById('li_pass').value;
  if(authConfig && u === authConfig.username && p === authConfig.password){
    currentUser = u;
    loggedIn = true;
    loginError = '';
    authState = 'app';
    loadData();
  } else {
    loginError = 'Incorrect username or password.';
    renderAuth();
  }
}

function doLogout(){
  loggedIn = false;
  currentUser = '';
  loginError = '';
  authState = 'login';
  productsLoaded = false;
  openQtyForm = null; editModal = null; confirmDelete = null; openHistory = null; searchTerm='';
  renderAuth();
}

function openChangeLogin(){ changeLoginOpen = true; changeLoginError=''; render(); }
function closeChangeLogin(){ changeLoginOpen = false; render(); }
async function saveChangeLogin(){
  const cur = document.getElementById('cl_current').value;
  const nu = document.getElementById('cl_newuser').value.trim();
  const np = document.getElementById('cl_newpass').value;
  const errEl = document.getElementById('cl_err');
  if(cur !== authConfig.password){
    errEl.textContent = 'Current password is incorrect.'; errEl.style.display='block'; return;
  }
  if(!nu || !np){
    errEl.textContent = 'New username and password are required.'; errEl.style.display='block'; return;
  }
  authConfig = { username: nu, password: np };
  try{
    await window.storage.set(AUTH_KEY, JSON.stringify(authConfig), true);
  }catch(e){
    errEl.textContent = 'Could not save, try again.'; errEl.style.display='block'; return;
  }
  currentUser = nu;
  changeLoginOpen = false;
  render();
}

/* ---------------- DATA ---------------- */

async function loadData(){
  try{
    const res = await window.storage.get(PRODUCTS_KEY, true);
    products = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    products = [];
  }
  productsLoaded = true;
  render();
}

async function saveData(){
  try{
    await window.storage.set(PRODUCTS_KEY, JSON.stringify(products), true);
  }catch(e){
    console.error('Save failed', e);
  }
}

/* ---------------- MAIN RENDER ---------------- */

function render(){
  if(authState !== 'app' || !loggedIn){ renderAuth(); return; }
  const app = document.getElementById('app');
  if(!productsLoaded){ app.innerHTML = '<div class="loading">Loading register…</div>'; return; }

  const total = products.length;
  const lowCount = products.filter(p => (p.minQty || 0) > 0 && p.storeQty <= p.minQty).length;
  const buildCount = products.filter(p => p.buildQty > 0).length;

  let filtered = products;
  if(searchTerm.trim()){
    const t = searchTerm.trim().toLowerCase();
    filtered = products.filter(p => p.name.toLowerCase().includes(t));
  }

  let html = '';
  html += '<header class="top">';
  html += '  <div class="brand"><div class="tag">MEXO INDUSTRIES</div><h1>Inventory Management</h1><div class="sub">Stock register — store room &amp; build process</div></div>';
  html += '  <div class="top-right">';
  html += `    <span class="whoami">Signed in as ${esc(currentUser)}</span>`;
  html += '    <button class="linkbtn" onclick="openChangeLogin()">Change login</button>';
  html += '    <button class="linkbtn" onclick="doLogout()">Log out</button>';
  html += '    <button class="add-btn" onclick="openNewProduct()">+ Add Product</button>';
  html += '  </div>';
  html += '</header>';

  html += '<div class="stats">';
  html += `  <div class="stat"><div class="num">${total}</div><div class="lbl">Products tracked</div></div>`;
  html += `  <div class="stat"><div class="num">${buildCount}</div><div class="lbl">In build process</div></div>`;
  html += `  <div class="stat alertstat"><div class="num">${lowCount}</div><div class="lbl">Low on store stock</div></div>`;
  html += '</div>';

  html += '<div class="searchrow"><input type="text" placeholder="Search product…" value="' + esc(searchTerm) + '" oninput="onSearch(this.value)"></div>';

  if(products.length === 0){
    html += '<div class="empty"><p><strong>Register is empty</strong></p><p>Add your first product to start tracking store room and build-process quantities.</p></div>';
  } else if(filtered.length === 0){
    html += '<div class="empty"><p><strong>No match</strong></p><p>No product name matches your search.</p></div>';
  } else {
    filtered.slice().sort((a,b) => a.name.localeCompare(b.name)).forEach(p => { html += renderCard(p); });
  }

  app.innerHTML = html;

  if(editModal){ renderEditModal(); }
  if(confirmDelete){ renderDeleteModal(); }
  if(changeLoginOpen){ renderChangeLoginModal(); }
}

/* ---------------- PRODUCT CARD ---------------- */

function renderCard(p){
  const low = (p.minQty || 0) > 0 && p.storeQty <= p.minQty;
  const parts = p.subParts || [];
  let html = `<div class="card ${low ? 'lowstock' : ''}">`;
  html += '  <div class="card-head">';
  html += '    <div>';
  html += `      <div class="name">${esc(p.name)}</div>`;
  html += `      <div class="unit">unit: ${esc(p.unit)}${p.minQty ? ' · alert below ' + p.minQty : ''}</div>`;
  if(parts.length){
    html += `      <div class="kitline"><b>Kit includes:</b> ${parts.map(sp => esc(sp.name)).join(', ')}</div>`;
  }
  html += '    </div>';
  html += `    <div><button class="iconbtn" onclick="openEditProduct('${p.id}')">Edit</button><button class="iconbtn" onclick="askDelete('${p.id}')">Delete</button></div>`;
  html += '  </div>';

  html += '  <div class="qtyrow">';
  html += `    <div class="qtyblock ready"><div class="lbl">Ready in store</div><div class="val">${p.storeQty}<small>${esc(p.unit)}</small></div></div>`;
  html += `    <div class="qtyblock build"><div class="lbl">In build process</div><div class="val">${p.buildQty}<small>${esc(p.unit)}</small></div></div>`;
  html += '  </div>';

  html += '  <div class="actions">';
  html += `    <button class="actbtn primary" onclick="toggleQtyForm('${p.id}','tobuild')">Send to build</button>`;
  html += `    <button class="actbtn shift" onclick="toggleQtyForm('${p.id}','shift')" ${p.buildQty<=0?'disabled':''}>Shift to store</button>`;
  html += `    <button class="actbtn dispatch" onclick="toggleQtyForm('${p.id}','dispatch')" ${p.storeQty<=0?'disabled':''}>Dispatch order</button>`;
  html += '  </div>';

  const histCount = (p.history || []).length;
  html += `  <button class="histbtn" onclick="toggleHistory('${p.id}')">${openHistory===p.id ? 'Hide' : 'View'} dispatch history${histCount ? ' (' + histCount + ')' : ''}</button>`;

  if(openQtyForm && openQtyForm.id === p.id){ html += renderQtyForm(p, openQtyForm.mode); }
  if(openHistory === p.id){ html += renderHistoryPanel(p); }

  html += '</div>';
  return html;
}

function renderHistoryPanel(p){
  const hist = (p.history || []).slice().sort((a,b) => (b.ts||0) - (a.ts||0));
  let html = '<div class="history-panel"><div class="htitle">Dispatch history</div>';
  if(hist.length === 0){
    html += '<div class="history-empty">No dispatches recorded yet.</div>';
  } else {
    hist.forEach(h => {
      html += '<div class="hist-row">';
      html += '<div class="hist-top">';
      html += `<span class="hqty">${h.qty} ${esc(p.unit)}</span>`;
      html += `<span class="hpo ${h.po ? '' : 'none'}">${h.po ? 'PO ' + esc(h.po) : 'No PO'}</span>`;
      html += `<span class="hdate">${formatDate(h.date)}</span>`;
      html += '</div>';
      if(h.excluded && h.excluded.length){
        html += `<div class="hist-kit partial">All items except: ${h.excluded.map(esc).join(', ')}</div>`;
      } else if(p.subParts && p.subParts.length){
        html += `<div class="hist-kit full">Full kit</div>`;
      }
      html += '</div>';
    });
  }
  html += '</div>';
  return html;
}

/* ---------------- QTY FORM (build / shift / dispatch) ---------------- */

function renderQtyForm(p, mode){
  let label = '', max = null, hint = '';
  if(mode === 'tobuild'){
    label = 'Qty being sent for fabrication';
    hint = 'Adds to "in build process" for ' + esc(p.name) + '.';
  } else if(mode === 'shift'){
    label = 'Qty completed, shift to store';
    max = p.buildQty;
    hint = 'Moves from build process into ready store stock. Max ' + p.buildQty + ' ' + esc(p.unit) + '.';
  } else if(mode === 'dispatch'){
    label = 'Qty going out (order dispatched)';
    max = p.storeQty;
    hint = 'Reduces ready store stock. Max ' + p.storeQty + ' ' + esc(p.unit) + '.';
  }
  let html = '<div class="inline-form">';
  html += `<label>${label}</label>`;
  html += `<input type="number" min="1" ${max!==null?'max="'+max+'"':''} id="qtyinput_${p.id}" placeholder="0" inputmode="numeric">`;

  if(mode === 'dispatch'){
    html += `<div class="subfield"><span>PO number <span class="optional">(optional)</span></span><input type="text" id="poinput_${p.id}" placeholder="e.g. PO-1042"></div>`;
    html += `<div class="subfield"><span>Dispatch date</span><input type="date" id="dateinput_${p.id}" value="${todayStr()}"></div>`;

    if(p.subParts && p.subParts.length){
      html += '<div class="kitbox">';
      html += `<div class="fk-row"><input type="checkbox" id="fullkit_${p.id}" checked onchange="onFullKitToggle('${p.id}')"> <label style="width:auto;">Full kit going (all parts included)</label></div>`;
      html += `<div class="parts" id="kitparts_${p.id}" style="display:none;">`;
      html += '<div class="ph">Tick the part(s) that are NOT going in this dispatch:</div>';
      p.subParts.forEach(sp => {
        html += `<label><input type="checkbox" class="kitpart_${p.id}" value="${esc(sp.name)}"> ${esc(sp.name)}</label>`;
      });
      html += '</div></div>';
    }
  }

  html += `<button class="go" onclick="submitQtyForm('${p.id}','${mode}')">Confirm</button>`;
  html += `<button class="cancel" onclick="closeQtyForm()">Cancel</button>`;
  html += `<div class="hint">${hint}${mode==='dispatch' ? ' PO number is optional — leave blank if dispatching without one.' : ''}</div>`;
  html += '</div>';
  return html;
}

function onFullKitToggle(id){
  const fk = document.getElementById('fullkit_' + id);
  const box = document.getElementById('kitparts_' + id);
  if(!fk || !box) return;
  box.style.display = fk.checked ? 'none' : 'block';
}

function toggleQtyForm(id, mode){
  if(openQtyForm && openQtyForm.id === id && openQtyForm.mode === mode){
    openQtyForm = null;
  } else {
    openQtyForm = { id, mode };
    openHistory = null;
  }
  render();
  setTimeout(() => { const el = document.getElementById('qtyinput_' + id); if(el) el.focus(); }, 30);
}
function closeQtyForm(){ openQtyForm = null; render(); }

function submitQtyForm(id, mode){
  const input = document.getElementById('qtyinput_' + id);
  const qty = parseInt(input.value, 10);
  if(!qty || qty <= 0){ input.focus(); return; }
  const p = products.find(x => x.id === id);
  if(!p) return;

  if(mode === 'tobuild'){
    p.buildQty += qty;
  } else if(mode === 'shift'){
    const amt = Math.min(qty, p.buildQty);
    p.buildQty -= amt;
    p.storeQty += amt;
  } else if(mode === 'dispatch'){
    const amt = Math.min(qty, p.storeQty);
    p.storeQty -= amt;
    const poEl = document.getElementById('poinput_' + id);
    const dateEl = document.getElementById('dateinput_' + id);
    const po = poEl ? poEl.value.trim() : '';
    const date = (dateEl && dateEl.value) ? dateEl.value : todayStr();

    let excluded = [];
    if(p.subParts && p.subParts.length){
      const fk = document.getElementById('fullkit_' + id);
      const isFull = fk ? fk.checked : true;
      if(!isFull){
        const checks = document.querySelectorAll('#kitparts_' + id + ' input:checked');
        excluded = Array.from(checks).map(c => c.value);
      }
    }
    if(!p.history) p.history = [];
    p.history.push({ id: uid(), qty: amt, po, date, ts: Date.now(), excluded });
  }
  openQtyForm = null;
  saveData();
  render();
}

function onSearch(v){ searchTerm = v; render(); }
function toggleHistory(id){ openHistory = openHistory === id ? null : id; openQtyForm = null; render(); }

/* ---------------- ADD / EDIT PRODUCT ---------------- */

function openNewProduct(){
  editModal = { id:null, name:'', unit:'pcs', storeQty:0, buildQty:0, minQty:0, subParts:[], isNew:true };
  render();
}
function openEditProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  editModal = Object.assign({}, p, { subParts: (p.subParts||[]).map(sp => Object.assign({}, sp)), isNew:false });
  render();
}
function closeEditModal(){ editModal = null; render(); }

function renderEditModal(){
  const m = editModal;
  const app = document.getElementById('app');
  let html = '<div class="overlay" onclick="if(event.target===this) closeEditModal()"><div class="modal">';
  html += `<h2>${m.isNew ? 'Add Product' : 'Edit Product'}</h2>`;
  html += '<div class="field"><label>Product name</label><input type="text" id="f_name" value="' + esc(m.name) + '" placeholder="e.g. FCA Body"></div>';
  html += '<div class="field-row">';
  html += '<div class="field"><label>Unit</label><input type="text" id="f_unit" value="' + esc(m.unit) + '" placeholder="pcs / kg / mtr"></div>';
  html += '<div class="field"><label>Low-stock alert below</label><input type="number" min="0" id="f_min" value="' + (m.minQty||0) + '"></div>';
  html += '</div>';
  html += '<div class="field-row">';
  html += '<div class="field"><label>Ready in store</label><input type="number" min="0" id="f_store" value="' + m.storeQty + '"></div>';
  html += '<div class="field"><label>In build process</label><input type="number" min="0" id="f_build" value="' + m.buildQty + '"></div>';
  html += '</div>';
  if(!m.isNew){
    html += '<div class="field-note">Correcting these directly overwrites the quantities — use this if a shift or entry was done by mistake.</div>';
  }

  html += '<div class="field"><label>Kit components <span style="text-transform:none;letter-spacing:0;">(optional — only if this product is made of separate parts)</span></label>';
  html += '<div class="addpart-row"><input type="text" id="f_newpart" placeholder="e.g. Base Plate" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addSubPart();}"><button type="button" onclick="addSubPart()">Add part</button></div>';
  html += '<div class="chiplist">';
  (m.subParts||[]).forEach((sp, idx) => {
    html += `<div class="chip">${esc(sp.name)}<button type="button" onclick="removeSubPart(${idx})">×</button></div>`;
  });
  html += '</div></div>';

  html += '<div class="err" id="f_err" style="display:none;"></div>';
  html += '<div class="modal-actions">';
  html += '<button class="btn-cancel" onclick="closeEditModal()">Cancel</button>';
  html += `<button class="btn-save" onclick="saveProductForm()">${m.isNew ? 'Add product' : 'Save changes'}</button>`;
  html += '</div></div></div>';
  app.insertAdjacentHTML('beforeend', html);
}

function addSubPart(){
  const inp = document.getElementById('f_newpart');
  const val = inp.value.trim();
  if(!val) return;
  if(!editModal.subParts) editModal.subParts = [];
  editModal.subParts.push({ id: uid(), name: val });
  render();
  setTimeout(() => { const el = document.getElementById('f_newpart'); if(el) el.focus(); }, 30);
}
function removeSubPart(idx){
  editModal.subParts.splice(idx, 1);
  render();
}

function saveProductForm(){
  const name = document.getElementById('f_name').value.trim();
  const unit = document.getElementById('f_unit').value.trim() || 'pcs';
  const minQty = parseInt(document.getElementById('f_min').value, 10) || 0;
  const store = parseInt(document.getElementById('f_store').value, 10) || 0;
  const build = parseInt(document.getElementById('f_build').value, 10) || 0;
  const errEl = document.getElementById('f_err');

  if(!name){ errEl.textContent = 'Product name is required.'; errEl.style.display = 'block'; return; }

  if(editModal.isNew){
    const dup = products.some(p => p.name.toLowerCase() === name.toLowerCase());
    if(dup){ errEl.textContent = 'A product with this name already exists.'; errEl.style.display = 'block'; return; }
    products.push({ id: uid(), name, unit, storeQty: store, buildQty: build, minQty, subParts: editModal.subParts || [], history: [] });
  } else {
    const p = products.find(x => x.id === editModal.id);
    if(p){
      p.name = name; p.unit = unit; p.minQty = minQty;
      p.storeQty = store; p.buildQty = build;
      p.subParts = editModal.subParts || [];
    }
  }
  editModal = null;
  saveData();
  render();
}

function askDelete(id){ confirmDelete = id; render(); }
function cancelDelete(){ confirmDelete = null; render(); }
function renderDeleteModal(){
  const p = products.find(x => x.id === confirmDelete);
  const app = document.getElementById('app');
  if(!p) return;
  let html = '<div class="overlay" onclick="if(event.target===this) cancelDelete()"><div class="modal">';
  html += '<h2>Delete product</h2>';
  html += `<p style="font-size:14px; color:var(--muted); margin-top:-8px;">Remove "${esc(p.name)}" from the register? This deletes its store, build-process and dispatch history. This can't be undone.</p>`;
  html += '<div class="modal-actions">';
  html += '<button class="btn-cancel" onclick="cancelDelete()">Cancel</button>';
  html += `<button class="btn-danger" onclick="doDelete()">Delete</button>`;
  html += '</div></div></div>';
  app.insertAdjacentHTML('beforeend', html);
}
function doDelete(){
  products = products.filter(x => x.id !== confirmDelete);
  confirmDelete = null;
  saveData();
  render();
}

/* ---------------- CHANGE LOGIN MODAL ---------------- */

function renderChangeLoginModal(){
  const app = document.getElementById('app');
  let html = '<div class="overlay" onclick="if(event.target===this) closeChangeLogin()"><div class="modal">';
  html += '<h2>Change Login</h2>';
  html += '<div class="field"><label>Current password</label><input type="password" id="cl_current" placeholder="Confirm current password"></div>';
  html += '<div class="field"><label>New username</label><input type="text" id="cl_newuser" value="' + esc(authConfig.username) + '"></div>';
  html += '<div class="field"><label>New password</label><input type="password" id="cl_newpass" placeholder="New password"></div>';
  html += '<div class="err" id="cl_err" style="display:none;"></div>';
  html += '<div class="field-note">Anyone using this register (including on other devices) will need the new login next time they sign in.</div>';
  html += '<div class="modal-actions">';
  html += '<button class="btn-cancel" onclick="closeChangeLogin()">Cancel</button>';
  html += '<button class="btn-save" onclick="saveChangeLogin()">Save login</button>';
  html += '</div></div></div>';
  app.insertAdjacentHTML('beforeend', html);
}

if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {})); }

boot();
</script>
